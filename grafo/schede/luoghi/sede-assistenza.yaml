id: sede-assistenza
nome: Sede Meridian dell'assistenza
capitoli: [1, 2, 3, 5, 14, 15]
sintesi: "L'edificio dove lavora Tom: corridoio, stanze dei tecnici, nastro, varco con controlli."
caratteristiche:
  - {testo: "Corridoio da cui si sentono terminale e nastro; ci passa Pete", fonte: "c2:9, c2:25"}
  - {testo: "«Le stanze dei tecnici»: ogni tecnico ha la sua", fonte: "c2:9"}
  - {testo: "Varco con controlli casuali", fonte: "c3:13"}
  - {testo: "Al varco si passa il badge; il sistema di accesso registra l'orario", fonte: "c5:9"}
  - {testo: "Alla pausa pranzo le porte delle stanze singole si aprono una dopo l'altra e i colleghi vanno in mensa", fonte: "c14:35"}
  - {testo: "Il corridoio dell'assistenza: al mattino odora di detergente e aria ferma; pavimento di linoleum; a un capo ci sono le scale", fonte: "c15:9, c15:23"}
non_detto:
  - {testo: "Città e nome della sede non sono indicati nei cap. 1-3."}
relazioni:
  - {verso: meridian, tipo: "sede di"}

