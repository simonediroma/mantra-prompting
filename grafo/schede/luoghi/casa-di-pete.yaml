id: casa-di-pete
nome: Casa di Pete
capitoli: [17]
sintesi: "Il soggiorno dove Pete passa ogni sera sul divano."
caratteristiche:
  - {testo: "Divano a tre posti, tavolino, bracciolo su cui sta il telefono di lavoro; il completo appeso alla porta del soggiorno", fonte: "c17:26"}
  - {testo: "Televisore Meridian «di una serie senza pretese»: in sei anni non gli ha mai detto niente oltre il volume e, a notte fonda, la domanda se stia ancora guardando; senza risposta si spegne da solo", fonte: "c17:38, c17:60"}
note:
  - {testo: "Anche Pete ha un televisore Meridian, a cui «non aveva mai chiesto altro» (c17 r. 38): l'opposto di Tom, che agli apparecchi fa domande."}

