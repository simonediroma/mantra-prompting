id: fattore-turno
nome: Turni e fattore turno
capitoli: [2, 3]
sintesi: "Tre turni a rotazione; ogni turno moltiplica la sanzione per un fattore diverso."
caratteristiche:
  - {testo: "Mattino 1,5 · pomeriggio 2,5 (il più penalizzante) · notte 1,2; nessun documento spiega perché", fonte: "c2:21"}
  - {testo: "Supplemento base fisso di 15 minuti in ogni comunicazione disciplinare", fonte: "c2:21"}
  - {testo: "La rotazione segue una tabella che nessuno ha mai capito", fonte: "c3:9"}
  - {testo: "Tom: pomeriggio al primo contatto; mattino «da qualche settimana» al secondo", fonte: "c3:9"}

