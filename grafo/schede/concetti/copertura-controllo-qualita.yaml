id: copertura-controllo-qualita
nome: La copertura del «controllo qualità»
capitoli: [4, 5]
sintesi: "La scusa con cui Tom chiama la signora Voss: una breve intervista del controllo qualità Meridian su come si è trovata con l'assistenza."
caratteristiche:
  - {testo: "Inventata la sera prima, provando frasi a voce alta alla scrivania; nel quaderno non c'è scritta", fonte: "c4:9"}
  - {testo: "La formula: «la chiamo dal controllo qualità di Meridian per una breve intervista…»: «per metà, vera»", fonte: "c4:19"}
  - {testo: "La gaffe: Tom dice che il televisore «è appena uscito dall'assistenza tecnica», cosa che un addetto qualità non saprebbe; rattoppa con «è quello che mi dice il sistema da qui»", fonte: "c4:23"}
  - {testo: "Tom si giudica un principiante: nessuno script, copione scivolato di mano dopo la prima frase", fonte: "c4:53"}
  - {testo: "Per restare credibile Tom richiama alla stessa ora e con la stessa voce «rassicurante e indicativamente annoiata»: un servizio clienti vero non chiama alle undici di sera", fonte: "c5:31"}
relazioni:
  - {verso: rito-delle-domande, tipo: "applica alle persone il", fonte: "c4:13"}

