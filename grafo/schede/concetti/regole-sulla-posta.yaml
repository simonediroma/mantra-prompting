id: regole-sulla-posta
nome: Le regole (scritte e non) su posta e pausa
capitoli: [13, 14, 15, 16, 17, 18]
sintesi: "In Meridian contano l'ora e il luogo da cui parte una mail. Emma e Tom le usano entrambi come copertura."
caratteristiche:
  - {testo: "Per Emma «le regole di Meridian sulla posta» coprono ciò che sta dietro le sue domande; scrive alle dieci e mezza, dentro il turno di Tom", fonte: "c13:45"}
  - {testo: "Lavorare in pausa non è vietato da nessuna regola scritta: per questo è guardato peggio di molte cose vietate", fonte: "c14:35"}
  - {testo: "Una mail personale su un computer aziendale «non era lavorare, o almeno nessuno avrebbe potuto dimostrarlo»", fonte: "c14:35"}
  - {testo: "Una mail inviata in pausa porta l'ora della pausa: basta a un supervisore per aprire una pratica. Inviata a banco vuoto, a turno ripreso, è inattaccabile", fonte: "c14:37"}
  - {testo: "«Una mail di un dipendente, una volta partita, non apparteneva più del tutto al dipendente»", fonte: "c14:33"}
  - {testo: "Valgono per tutti: Tom non conosce gli orari di nessun laboratorio ma le conosce. Una mail partita al primo secondo utile del turno (08:00:01) è una mail già scritta", fonte: "c15:11"}
  - {testo: "La regola che Tom si è dato: a banco vuoto nessuno può rimproverargli di sottrarre tempo al lavoro", fonte: "c15:13"}
  - {testo: "La domenica in Meridian non si scrive, «a tutela del riposo dei dipendenti»: avviso automatico al supervisore per chi trasgredisce", fonte: "c16:17"}
  - {testo: "Una mail fuori orario fa partire un avviso al supervisore di chi la riceve, «come sapevano tutti»", fonte: "c16:45"}
  - {testo: "Il sabato si lavora e si scrive (la mail delle 08:00:01 è di sabato)", fonte: "c16:17"}
  - {testo: "Ricevere una mail di notte non è un'infrazione; aprirla è lavorare fuori orario (una smutandata semplice, per Pete)", fonte: "c17:16, c17:58"}
  - {testo: "Un supervisore può leggere per intero le mail nella casella di un sottoposto, una volta aperte; non quelle di mittenti fuori dalla sua giurisdizione", fonte: "c17:54"}
  - {testo: "Anche una mail in orario verso un indirizzo nuovo finisce nel riepilogo del supervisore, come riga senza infrazione", fonte: "c17:52"}
  - {testo: "Quando il sottoposto apre una mail e risponde, al supervisore si apre l'intero thread, dalla prima mail all'ultima", fonte: "c18:43"}
  - {testo: "Un invito in calendario si può accettare senza scrivere una parola", fonte: "c18:39"}
non_detto:

aperti:
  - {testo: "L'avviso per una mail fuori orario va al supervisore di chi la RICEVE (c16 r. 45): Emma, scrivendo alle 23:34, espone Tom, non se stessa."}
  - {testo: "Se ogni mail verso un indirizzo nuovo compare nel riepilogo e ogni thread di un sottoposto è leggibile, la prudenza di Tom sull'ora d'invio (cap. 14) lo protegge dall'infrazione ma non dalla lettura: lo capisce solo nel cap. 17 (r. 20)."}
