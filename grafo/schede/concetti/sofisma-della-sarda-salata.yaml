id: sofisma-della-sarda-salata
nome: Il sofisma della sarda salata
capitoli: [16]
sintesi: "«La sarda salata fa bere e ribere; il bere e ribere estingue la sete; quindi la sarda salata estingue la sete.» Dà a Emma la chiave della propria impasse."
caratteristiche:
  - {testo: "Il sofisma, detto da Tommy", fonte: "c16:39"}
  - {testo: "Lettura di Emma: da una settimana «beveva e ribeveva» la mail di Tom, con più sete a ogni giro, aspettando che a toglierle la sete fosse ciò che la provocava", fonte: "c16:41"}
  - {testo: "Emma ha la risposta al sofisma prima che Tommy finisca, ma non la dà", fonte: "c16:41"}
aperti:
  - {testo: "È un'altra ripetizione che non sazia: Emma rilegge la stessa mail come la signora riguardava lo stesso video. Qui la ripetizione finisce con Emma che fa una cosa mai fatta."}
relazioni:
  - {verso: tommy, tipo: "detto da", fonte: "c16:39"}
  - {verso: risposta-di-tom, tipo: "applicato a", fonte: "c16:41"}

