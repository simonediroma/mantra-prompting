id: porta-accostata
nome: La porta accostata
capitoli: [15, 17]
sintesi: "Per la prima volta in dodici anni Tom non chiude a doppia mandata: lascia un palmo di corridoio in vista, per vedere se qualcuno «non passa e basta»."
caratteristiche:
  - {testo: "Una porta chiusa fa sentire solo bussare; accostata fa vedere la gente arrivare dal fondo", fonte: "c15:9"}
  - {testo: "Motivo: il giorno prima una sua mail è partita verso un indirizzo estraneo alla sua lista di riparazioni", fonte: "c15:9"}
  - {testo: "La prima persona che passa, Pete, rallenta", fonte: "c15:23"}
  - {testo: "A fine capitolo è ancora accostata", fonte: "c15:31"}
  - {testo: "Visto da Pete: «La porta, per la prima volta in dodici anni, l'aveva trovata accostata… un tecnico seduto di tre quarti davanti a un banco vuoto, con l'aria di chi aspetta qualcuno»", fonte: "c17:52"}
  - {testo: "Pete era passato «apposta», per far sentire la sua presenza, quattro giorni dopo la riga della prima mail", fonte: "c17:52"}
aperti:
  - {testo: "La vedetta ha un effetto opposto a quello voluto: è proprio la porta aperta, insolita, a dare a Pete qualcosa da notare (c17 r. 52)."}
  - {testo: "Con la porta accostata Tom dice ad alta voce «E tu come fai a saperlo?» (c15 r. 21), poco prima che passi Pete."}
relazioni:
  - {verso: laboratorio-di-tom, tipo: "riguarda", fonte: "c15:9"}

