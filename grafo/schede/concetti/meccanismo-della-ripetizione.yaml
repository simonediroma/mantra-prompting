id: meccanismo-della-ripetizione
nome: Il meccanismo - la stessa cosa ripetuta finché non c'è più spazio
capitoli: [13, 19]
sintesi: "Ciò che Emma sa da sempre: un apparecchio che riceve lo stesso contenuto abbastanza volte da non avere più spazio per altro cambia comportamento. Ogni caso del suo archivio ha la stessa curva."
caratteristiche:
  - {testo: "«Cosa succedesse a un apparecchio che riceveva la stessa cosa tante volte da non avere più spazio per nient'altro, Emma lo sapeva da prima dell'archivio, da prima di eTv»", fonte: "c13:27"}
  - {testo: "La curva: bassa all'inizio, sempre più ripida, interrotta di colpo, nei giorni prima della chiamata all'assistenza", fonte: "c13:25"}
  - {testo: "I log mancano proprio nei giorni in cui la curva sale più in fretta", fonte: "c13:33"}
  - {testo: "Per Emma un picco è il segno che un contenuto «aveva fatto quello che doveva»", fonte: "c13:27"}
  - {testo: "È la stessa cosa che Emma evita con il fondatore: sa «dove poteva portare una domanda ripetuta abbastanza a lungo»", fonte: "c11:25"}
  - {testo: "Il cap. 19 dà il pezzo tecnico: la finestra di contesto che si riempie e il compattamento. Il legame con la ripetizione resta implicito", fonte: "c19:41"}
non_detto:
  - {testo: "Il testo non collega esplicitamente questo meccanismo alla riga «compacting context» dei log (cap. 1): il legame è lasciato al lettore."}
  - {testo: "Il meccanismo non ha ancora un nome nel testo."}
note:
  - {testo: "Il video è stato visto da decine di migliaia di persone senza effetti (c13 r. 37): serve la ripetizione sullo stesso apparecchio. Quante ripetizioni bastino non è detto; nel caso Voss, settimane a dieci al giorno e poi una salita fino a trenta."}
  - {testo: "Chi fa salire le riproduzioni da dieci a trenta al giorno negli ultimi giorni: la signora, o il televisore stesso? Il testo dà solo la curva."}
relazioni:
  - {verso: mantra, tipo: "è la forma del", fonte: "c13:27"}
  - {verso: compacting-context, tipo: "probabilmente legato a", nota: "legame non esplicitato dal testo"}
  - {verso: indovinello-del-fondatore, tipo: "stesso principio di", fonte: "c11:25"}

