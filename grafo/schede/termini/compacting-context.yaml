  - {testo: "Sul giradischi compare ogni volta che il modellino IA si ferma a riassumere: «una pausa per fare spazio, niente di più»", fonte: "c1:91"}
  - {testo: "Nel caso zero la riga ha data anteriore alla consegna dell'apparecchio", fonte: "c1:93"}
non_detto:
