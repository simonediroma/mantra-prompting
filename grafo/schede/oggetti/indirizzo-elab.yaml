id: indirizzo-elab
nome: elab@meridian.com
capitoli: [9, 10, 11, 14, 16]
sintesi: "L'indirizzo che l'archivio interno indica come contatto del contenuto corrispondente al video di yoga."
caratteristiche:
  - {testo: "Campo «Contatto» della corrispondenza trovata", fonte: "c9:35"}

  - {testo: "Casella gestita da Emma. Da anni riceve solo posta automatica, newsletter mai cancellate, notifiche di sistema notturne", fonte: "c10:17"}
  - {testo: "La mail di Tom è la prima «vera», con mittente Meridian riconoscibile, da moltissimo tempo", fonte: "c10:17"}
  - {testo: "Il contatto nell'archivio «l'aveva scritto il sistema, anni prima»", fonte: "c10:23"}
  - {testo: "Emma la controlla per tutto il giorno; alle diciassette la chiude vuota", fonte: "c11:37"}
  - {testo: "Il fondatore ha smesso di ricordarla da anni", fonte: "c11:27"}
  - {testo: "Tom lo aveva «creduto morto»", fonte: "c14:27"}
  - {testo: "Vuota per sei giorni; alle 23:34 di venerdì ne parte la prima mail fuori orario", fonte: "c16:23, c16:47"}
aperti:
  - {testo: "«Quel contatto l'aveva scritto il sistema, anni prima» (c10 r. 23): ma il contatto è quello associato al video, generato 6 mesi prima (c9 r. 32), e l'archivio etichetta i contenuti da «un paio d'anni» (c9 r. 25). Se Emma intende che l'indirizzo di Elab è stato impostato anni fa come contatto predefinito, conviene dirlo."}
relazioni:
  - {verso: emma, tipo: "gestita da", fonte: "c10:17"}
