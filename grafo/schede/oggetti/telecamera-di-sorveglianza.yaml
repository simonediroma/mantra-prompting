id: telecamera-di-sorveglianza
nome: La telecamera di sorveglianza e il suo pannello
capitoli: [18]
sintesi: "La telecamera sopra la porta del laboratorio di Tom. I supervisori ne vedono un'anteprima e possono fare sette scatti; il video completo è degli ispettori."
caratteristiche:
  - {testo: "Avvitata al muro nell'angolo sopra lo stipite della porta", fonte: "c18:60"}
  - {testo: "Al buio toglie da sola il filtro davanti all'obiettivo, con un «clic», e passa al bianco e nero con la massima sensibilità", fonte: "c18:60"}
  - {testo: "Pannello: «Laboratorio · Divisione Assistenza Tecnica · Tom · Accesso supervisore: anteprima in diretta, fino a 7 scatti a comando · Video completo: riservato agli ispettori interni»", fonte: "c18:66-68"}
  - {testo: "Per Pete sette scatti bastano: dove c'è una trascrizione servono solo a «mettere una faccia accanto alle parole»", fonte: "c18:70"}
non_detto:
  - {testo: "Da quando la telecamera sia in quella stanza non è detto."}
aperti:
  - {testo: "Se c'era già ai tempi dei cap. 1 e 3, ha ripreso Tom che parla ai televisori e il LED che lampeggia in Morse: quei video sarebbero accessibili agli ispettori interni."}
  - {testo: "La telecamera riprende anche l'audio? La trascrizione viene dal meeting, non dalla telecamera; delle frasi che Tom dice ad alta voce nella stanza il testo non dice se restino registrate."}
relazioni:
  - {verso: laboratorio-di-tom, tipo: "si trova in", fonte: "c18:60"}
  - {verso: ispettori-interni, tipo: "video completo riservato a", fonte: "c18:68"}

