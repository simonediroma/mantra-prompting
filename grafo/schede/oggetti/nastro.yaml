id: nastro
nome: Nastro
capitoli: [2, 3, 14]
sintesi: "Il nastro che porta gli apparecchi alle stanze dei tecnici. Fruscio in corridoio, «clac» a ogni consegna."
caratteristiche:
  - {testo: "Fruscio udibile dal corridoio a inizio turno", fonte: "c2:9"}
  - {testo: "Passa dietro la parete del laboratorio; fa «clac» quando consegna", fonte: "c2:45, c3:17"}
  - {testo: "Porta il prossimo apparecchio appena il tecnico preme il pulsante di chiusura dell'intervento; porta via quello finito verso l'uscita", fonte: "c14:15, c14:29"}
  - {testo: "Fermo durante la pausa pranzo; riparte con un «clac» metallico", fonte: "c14:35, c14:39"}
  - {testo: "Da quando c'è, ogni tecnico è chiuso in una stanza singola", fonte: "c14:27"}
relazioni:
  - {verso: sede-assistenza, tipo: "si trova in"}

