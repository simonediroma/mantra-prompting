id: disco-tango
nome: Il disco «Tango» dei Matia Bazar
capitoli: [7, 8]
sintesi: "Il vinile che Tom mette per concentrarsi la sera in cui cerca il video."
caratteristiche:
  - {testo: "Non lo metteva da anni; parte con un «crr» di polvere", fonte: "c7:11, c7:15"}
  - {testo: "Prima canzone: Vacanze romane", fonte: "c7:15"}
  - {testo: "Terza traccia mentre Tom scorre il canale; il lato A finisce senza che se ne accorga («crr crr» a vuoto)", fonte: "c8:9, c8:21"}
  - {testo: "Tom gira il disco e lascia partire «Il video sono io», poi spegne", fonte: "c8:21"}
aperti:
  - {testo: "Tom gira il disco, fa partire «Il video sono io» «poi spense il giradischi»: il titolo della canzone è l'ultima parola del capitolo sul tema del video generato. Voluto: da non perdere in revisione."}
relazioni:
  - {verso: giradischi-di-tom, tipo: "suonato su", fonte: "c7:9"}

