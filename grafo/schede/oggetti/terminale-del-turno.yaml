id: terminale-del-turno
nome: Terminale del turno
capitoli: [2, 14, 15, 18]
sintesi: "Il terminale di Tom. Si accende con un accordo di tre note (dlin); mostra comunicazioni e registro interventi."
caratteristiche:
  - {testo: "Accordo di tre note, «dlin», voluto dall'HR", fonte: "c2:9"}
  - {testo: "Icona rossa lampeggiante in alto a destra per le comunicazioni di «rilevanza personale»: in dodici anni mai una buona notizia", fonte: "c2:9"}
  - {testo: "In laboratorio Tom ha un computer aziendale con posta e mouse; le mail che ne partono portano l'ora", fonte: "c14:15, c14:37"}
  - {testo: "Suona le tre note alle otto in punto", fonte: "c15:11"}
  - {testo: "Si accende alle otto con l'accordo di tre note; la casella mostra in grassetto la mail della notte con l'ora", fonte: "c18:11"}
relazioni:
  - {verso: laboratorio-di-tom, tipo: "si trova in"}
  - {verso: registro-interventi, tipo: "dà accesso a", fonte: "c2:29"}

