id: strumento-di-emma
nome: Lo strumento di analisi dei trend di Emma
capitoli: [10]
sintesi: "Un processo che Emma si è costruita da sé anni prima: scansiona la rete pubblica e restituisce, per macrocategoria, chi parla di cosa e da quanto."
caratteristiche:
  - {testo: "Scansiona social, forum, motori di ricerca: «ogni angolo pubblico della rete»", fonte: "c10:9"}
  - {testo: "Identifica le community di nicchia, quali utenti partecipano a quali conversazioni, se lo stesso utente è su più piattaforme", fonte: "c10:9"}
  - {testo: "Macrocategorie citate: fitness, bricolage, cucina, arte, intrattenimento, «tra le altre»", fonte: "c10:9"}
  - {testo: "Per ognuna: chi sono le persone, di cosa parlano più del solito, se da ieri o da anni", fonte: "c10:9"}
  - {testo: "Emma distingue i trend autentici da quelli generati a valle da una fonte come la televisione («rumore» non utile)", fonte: "c10:11"}
non_detto:
  - {testo: "A cosa servano i trend che Emma raccoglie non è detto nel cap. 10."}

