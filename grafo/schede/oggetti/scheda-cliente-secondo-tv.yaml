id: scheda-cliente-secondo-tv
nome: Scheda cliente del secondo televisore
capitoli: [3, 4, 15]
sintesi: "La scheda nella busta di plastica appiccicata sul retro del secondo televisore."
caratteristiche:
  - {testo: "Due frasi battute sotto dettatura: «Si rifiuta di accendersi. Lampeggia in un modo strano.»", fonte: "c3:17"}
  - {testo: "La seconda è «la frase che aspettava da tre mesi»: Tom la legge due volte", fonte: "c3:17"}
  - {testo: "Le due frasi coincidono con le parole della signora al telefono: «proprio non voleva… uno che si rifiuta», «lampeggia in un modo strano»", fonte: "c4:35, c4:41"}
  - {testo: "Tom ne copia la frase nella mail a Emma; ed è su «si rifiuta» che Emma fa la sua domanda", fonte: "c15:15-17"}
  - {testo: "Nelle schede i clienti danno da sempre una volontà agli elettrodomestici: il verbo non aveva mai fatto effetto a Tom", fonte: "c15:17"}
