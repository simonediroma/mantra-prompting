id: giradischi-di-tom
nome: Giradischi di Tom
capitoli: [1, 7, 8, 12]
sintesi: "L'hobby di Tom: un giradischi di ottant'anni fa a cui ha insegnato, con un modellino IA, a correggere l'equalizzazione in tempo reale."
caratteristiche:
  - {testo: "Giradischi di ottant'anni fa", fonte: "c1:15"}
  - {testo: "Corregge l'equalizzazione in base al peso del disco e alla posizione di chi ascolta rispetto agli speaker", fonte: "c1:15"}
  - {testo: "Ha un «modellino IA» che ogni tanto si ferma a riassumere i dati: nel suo log compare «compacting context», visto da Tom decine di volte", fonte: "c1:91"}
  - {testo: "Spiegato a una festa svuota la stanza in novanta secondi", fonte: "c1:15"}
  - {testo: "Sta nella stanza unica di casa; coperto da uno strato di polvere «che si accumula solo quando qualcosa viene evitato apposta»", fonte: "c7:9"}
  - {testo: "Comando vocale: «Calibra l'audio, sono qui.» Il sistema ottimizza l'equalizzazione sulla posizione di Tom", fonte: "c7:9"}
  - {testo: "Costruito con l'aiuto di un assistente IA", fonte: "c7:17"}
  - {testo: "Spento da Tom prima di andare a dormire", fonte: "c8:21"}
  - {testo: "È un progetto open source, con un sito e un forum attivi da anni", fonte: "c12:33-35"}
aperti:
  - {testo: "Il comando di Tom al giradischi è «sono qui» (c7 r. 9); il primo televisore gli aveva risposto «IO SONO QUI» (c1 r. 39). Eco voluta o coincidenza: il testo non la commenta."}
relazioni:
  - {verso: compacting-context, tipo: "mostra nel log", fonte: "c1:91"}

