id: ewatch
nome: eWatch
capitoli: [3]
sintesi: "L'orologio che Meridian ha regalato a tutti i dipendenti quell'inverno, presto diventato obbligatorio. Tom ci cronometra ogni intervento."
caratteristiche:
  - {testo: "Regalato «quell'inverno» a tutti i ventimila e passa dipendenti", fonte: "c3:9"}
  - {testo: "Diventato un obbligo: parte dell'abbigliamento da lavoro, con la scusa del benessere del dipendente", fonte: "c3:9"}
  - {testo: "Tom lo usa per cronometrare ogni intervento", fonte: "c3:9, c3:17"}
aperti:
  - {testo: "Nel cap. 1 «l'orologio gli disse» (r. 95) e nel cap. 2 «guardò l'ora» (r. 45): il testo non dice se è già l'eWatch. Il cap. 1 cade in inverno (tre mesi prima della fine dell'inverno, c3 r. 9), cioè nella stessa stagione del regalo."}

