id: mail-bluff-di-tom
nome: La prima mail di Tom a Elab (il bluff)
capitoli: [10, 12, 13, 17, 18]
sintesi: "La mail con cui Tom scrive a elab@meridian.com dicendo di aver trovato l'indirizzo nei log di un televisore. È falso, ed Emma lo sa."
caratteristiche:
  - {testo: "Testo: «Buongiorno, mi chiamo Tom, membro della Divisione Assistenza Tecnica. Nel corso di un intervento su un televisore ho rilevato nei log di sistema un riferimento a questo indirizzo di posta. Ho alcune domande sul televisore in questione e vorrei capire se possiate aiutarmi. Cordiali saluti, Tom.»", fonte: "c10:19"}
  - {testo: "Arrivata «la sera prima»; mittente Meridian riconoscibile", fonte: "c10:17"}
  - {testo: "La bugia: nessun dispositivo lascia indirizzi di posta nei log", fonte: "c10:21"}
  - {testo: "Deduzione di Emma: Tom è passato dall'archivio degli artefatti; resta da capire cosa abbia cercato e perché abbia mentito", fonte: "c10:23"}
  - {testo: "«Quattro righe e una firma»; «Divisione Assistenza Tecnica» scritta per intero, saluti di rito, frase costruita come una segnalazione di guasto", fonte: "c12:23, c12:29"}
  - {testo: "Riletta da Emma: troppo goffa per essere sincera, forse un'esca per vedere chi risponde e come", fonte: "c12:25"}
  - {testo: "Datata «tre giorni prima» del cap. 12 e «qualche settimana dopo» l'intervento sul televisore Voss", fonte: "c12:17, c12:23"}
  - {testo: "Terza lettura di Emma: «la scusa più debole che un tecnico potesse inventare per non dire che aveva davanti una cliente morta»", fonte: "c13:43"}
  - {testo: "Nel riepilogo di Pete, una decina di giorni prima: «una riga senza infrazione, una mail in orario verso un indirizzo a cui Tom non aveva mai scritto». Pete non apre il thread", fonte: "c17:52"}
  - {testo: "Come la legge Pete: «un tecnico che diceva di aver trovato un indirizzo nei registri di un apparecchio»", fonte: "c18:45"}
non_detto:
  - {testo: "Ora esatta e luogo d'invio (casa o azienda) non sono indicati. La scrittura della mail non è in scena."}
  - {testo: "La mail non nomina la signora Voss, il video, né quale televisore."}
note:
  - {testo: "«In orario» per il riepilogo di Pete (c17 r. 52), ma a Emma risulta «arrivata la sera prima» (c10 r. 17), cioè dopo le diciassette, quando lei chiude. Il turno di Tom finisce più tardi di quello di Emma? Eppure Tom legge la risposta delle 16:59 «a fine turno» (c14 r. 19)."}
relazioni:
  - {verso: indirizzo-elab, tipo: "inviata a", fonte: "c10:17"}
  - {verso: tv-secondo-contatto, tipo: "allude a", nota: "«un televisore», non specificato", fonte: "c10:19"}

