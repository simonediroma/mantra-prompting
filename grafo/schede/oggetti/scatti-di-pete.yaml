id: scatti-di-pete
nome: I sette scatti di Pete
capitoli: [19]
sintesi: "Le sette fotografie che Pete può fare durante il meeting: una sprecata, una utile, quattro bianche, l'ultima con il pennarello."
caratteristiche:
  - {testo: "1: al promemoria, un uomo che aspetta davanti a uno schermo vuoto", fonte: "c19:17"}
  - {testo: "2: Tom con la schiena a coprire il banco e un pennarello nero in mano, punta in basso", fonte: "c19:43"}
  - {testo: "3-6: quattro rettangoli bianchi identici, premuti di fila con la telecamera abbagliata", fonte: "c19:51"}
  - {testo: "7: Tom di spalle, felpa grigia, piegato verso sinistra come a cercare qualcosa sotto il banco; sullo schermo una donna sulla cinquantina con i capelli rossi e il vecchio logo; il pennarello rotolato al bordo del banco", fonte: "c19:73, c19:87-89"}
  - {testo: "Il settimo è «il secondo mattone»; salvato in una cartella chiamata «Doppia»", fonte: "c19:93"}
aperti:
  - {testo: "Nel settimo scatto Tom è «piegato verso sinistra, come se stesse cercando qualcosa sotto il banco» (c19 r. 87): è la mano sull'interruttore del LED. Pete non lo collega, per ora, ai quattro scatti bianchi, che attribuisce a un guasto provocato da lui."}
  - {testo: "Il settimo scatto contiene il volto di Emma (dell'avatar): è la prima immagine di lei in mano a qualcuno fuori da Elab."}
relazioni:
  - {verso: telecamera-di-sorveglianza, tipo: "fatti con la", fonte: "c19:17"}
  - {verso: tom, tipo: "ritraggono", fonte: "c19:87"}
  - {verso: avatar-di-emma, tipo: "ritraggono", fonte: "c19:87"}

