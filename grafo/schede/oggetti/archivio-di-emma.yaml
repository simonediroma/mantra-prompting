id: archivio-di-emma
nome: L'archivio delle anomalie di Emma
capitoli: [11, 12]
sintesi: "L'archivio privato in cui Emma registra i dispositivi con IA che i clienti segnalano come anomali senza che l'assistenza trovi guasti."
caratteristiche:
  - {testo: "Criterio: IA integrata, anomalia segnalata dal cliente, nessuna evidenza di guasto hardware o alterazione software: prodotti «al cento per cento funzionanti» che hanno smesso di fare ciò che gli utenti chiedono", fonte: "c11:29"}
  - {testo: "Primo caso: circa un anno prima; da allora le righe non hanno mai smesso di aumentare", fonte: "c11:35"}
  - {testo: "Emma aggiunge una colonna chip / senza chip e riordina per mese: senza chip i numeri restano stabili, con chip crescono mese dopo mese «con una regolarità che non aveva nulla di casuale»", fonte: "c11:35"}
  - {testo: "Voce del frigorifero: tutte le informazioni più «riconsegnato dopo hard reset»", fonte: "c11:31"}
  - {testo: "Contiene il caso Voss: data, modello, descrizione del comportamento anomalo. Non contiene i nomi dei tecnici", fonte: "c12:19"}
aperti:
  - {testo: "È lo specchio del quaderno nero di Tom: stesso fenomeno, due archivi privati. Quello di Emma parte un anno prima; il caso zero di Tom è di circa quattro mesi prima."}
  - {testo: "Cronologia: primo caso «circa un anno prima» (c11 r. 35), ma il video di yoga risulta generato «6 mesi fa» (c9 r. 32). Le anomalie precedono quel video: altri contenuti, o altra causa."}
non_detto:
  - {testo: "Se contenga anche il caso zero di Tom (il primo televisore) non è detto."}
relazioni:
  - {verso: lista-dispositivi-in-assistenza, tipo: "costruito sulla", fonte: "c11:29"}
  - {verso: frigorifero-anomalo, tipo: "registra", fonte: "c11:31"}

