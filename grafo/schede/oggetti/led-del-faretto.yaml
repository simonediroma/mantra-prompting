id: led-del-faretto
nome: Il LED del faretto da giardino (la contromossa di Tom)
capitoli: [18]
sintesi: "Il LED «più luminoso del sole» che Tom punta sulla telecamera di sorveglianza per poterla accecare a comando durante il meeting."
caratteristiche:
  - {testo: "Viene dal cassetto dei componenti di recupero: un faretto restituito anni prima perché «faceva più luce del sole»", fonte: "c18:60"}
  - {testo: "Saldato con due fili su un ritaglio di scheda e un vecchio alimentatore; posato per terra nell'angolo accanto alla porta, rivolto in su verso la telecamera", fonte: "c18:60"}
  - {testo: "Interruttore portato con un filo lungo sotto il banco, raggiungibile senza abbassare gli occhi", fonte: "c18:60"}
  - {testo: "Tom spegne il neon e accende solo la lampada da banco: la telecamera passa in notturna, e «un occhio abituato al buio si abbaglia con poco»", fonte: "c18:60"}
aperti:
  - {testo: "Un LED come arma di Tom: lo stesso tipo di componente con cui i televisori gli hanno parlato."}
relazioni:
  - {verso: telecamera-di-sorveglianza, tipo: "puntato contro", fonte: "c18:60"}

