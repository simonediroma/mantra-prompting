id: tritatutto
nome: Il tritatutto con la ciotola rigata
capitoli: [15]
sintesi: "Il primo lavoro che a Tom va male: rimonta la lama senza la rondella e riga la ciotola."
caratteristiche:
  - {testo: "Scheda: «Parte, fa un rumore terribile e si ferma dopo qualche secondo.» Giunto a stella spanato: un guasto da cinque minuti", fonte: "c15:25"}
  - {testo: "Al collaudo la lama raschia («krrr»): la rondella distanziale è rimasta sul panno. Tom riapre tutto e rimonta", fonte: "c15:29"}
  - {testo: "Resta un cerchio opaco di graffi sul fondo della ciotola: il cliente lo noterà", fonte: "c15:29"}
  - {testo: "Esito scritto: «riparato, sostituito giunto». Chiuso sull'ultimo secondo", fonte: "c15:29"}
aperti:
  - {testo: "La ciotola rigata non compare nell'esito: è un danno fatto in assistenza e non dichiarato. Possibile appiglio per Pete; il testo non lo dice."}

