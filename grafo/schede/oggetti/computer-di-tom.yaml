id: computer-di-tom
nome: Computer di Tom (a casa)
capitoli: [7, 8, 9, 17]
sintesi: "Il computer sulla scrivania di casa, con cui Tom cerca e analizza il video."
caratteristiche:
  - {testo: "Tom ci riapre la ricerca iniziata sul telefono", fonte: "c7:15"}
  - {testo: "Con la tastiera torna indietro un fotogramma alla volta; si avvicina fino a sentire il calore dello schermo", fonte: "c7:27"}
  - {testo: "Con questo Tom scorre la pagina del canale eTv", fonte: "c8:9"}
  - {testo: "Portatile o comunque spostabile: al mattino è sul tavolo di cucina", fonte: "c9:9"}
  - {testo: "Resta aperto sul tavolo della cucina; riceve le stesse notifiche dell'eWatch e non si spegne. Ha un touchpad", fonte: "c17:10, c17:16"}
  - {testo: "Tom lo lascia acceso tutta la notte con la riga della notifica", fonte: "c17:24"}
relazioni:
  - {verso: casa-di-tom, tipo: "si trova in", fonte: "c7:15"}

