id: pete
nome: Pete
capitoli: [2, 4, 5, 14, 15, 16, 17]
sintesi: "Supervisore della Divisione Assistenza Tecnica. Nei cap. 1-3 esiste solo come firma in fondo alla comunicazione formale."
caratteristiche:
  - {testo: "Firma: «Pete, Supervisore, Divisione Assistenza Tecnica»", fonte: "c2:23"}
  - {testo: "Si manifesta quasi solo per iscritto", fonte: "c2:25"}
  - {testo: "Ha «piccoli giochi sadici da supervisore»", fonte: "c2:25"}
  - {testo: "Paragonato a un piccione: non avverte prima e non si volta a controllare il danno", fonte: "c2:25"}
  - {testo: "Non nominato nel cap. 4, ma è «il supervisore» a cui un ritardo di pochi minuti darebbe «un nuovo pretesto»", fonte: "c4:57"}
  - {testo: "Non nominato nel cap. 5: sotto i cinque minuti il ritardo non gli viene comunicato", fonte: "c5:9"}
  - {testo: "Per Tom è il supervisore che sa «trasformare in un provvedimento» una chiamata fuori procedura; una mail in pausa gli basterebbe per aprire una pratica", fonte: "c14:33, c14:37"}
  - {testo: "Prima apparizione in scena, senza parole. Completo nero, camicia bianca, «una schiena larga quanto un armadio a due ante e più o meno della stessa forma»", fonte: "c15:23"}
  - {testo: "Passo pesante, un po' strascicato sul tallone", fonte: "c15:23"}
  - {testo: "Davanti alla porta accostata di Tom rallenta, gira la testa di qualche grado verso l'interno, non si ferma, non dice nulla; prosegue verso le scale", fonte: "c15:23"}
  - {testo: "È il supervisore a cui arriva l'avviso per la mail fuori orario ricevuta da Tom", fonte: "c16:45"}
  - {testo: "Passa tutte le sere sul divano, in mutande; il divano è a tre posti «e lui ne occupava tre». Cena d'asporto: cotoletta e patatine in un contenitore di alluminio", fonte: "c17:26"}
  - {testo: "«Grande nel modo in cui sono grandi certi ragazzi di terza media che a quattordici anni hanno già la barba»", fonte: "c17:26"}
  - {testo: "Il completo nero con la camicia bianca stirata sta appeso alla porta del soggiorno, pronto per l'indomani, ogni giorno", fonte: "c17:26"}
  - {testo: "«La versione meno nobile dell'agente Smith di Matrix»: a morte i nerd, evviva le bistecche, mai seguire il Bianconiglio. Vuole vendicare Smith facendo carriera nell'apparato di controllo di Meridian", fonte: "c17:26"}
  - {testo: "Dal liceo non è mai uscito davvero: era Biff di Ritorno al futuro. «Pratico più che intelligente»", fonte: "c17:28"}
  - {testo: "Guarda Ciao Darwin tifando per i «fighi»; usa «smutandata» anche per apprezzamenti lascivi sulle concorrenti", fonte: "c17:38"}
  - {testo: "Legge il riepilogo di mezzanotte alle 23:59 in punto, «come altri leggono l'oroscopo»; gli altri supervisori lo leggono il mattino o mai", fonte: "c17:40"}
  - {testo: "Non sopporta Tom perché è il tecnico più pulito della divisione: non gli lascia niente da fare. La sanzione dei 47 minuti è l'unica soddisfazione in dodici anni: l'ha firmata col nome per esteso e riletta due volte", fonte: "c17:52"}
  - {testo: "Può leggere una mail solo quando è nella casella di un suo sottoposto, cioè dopo che Tom l'ha aperta; del mittente «fuori giurisdizione» non vede il contenuto", fonte: "c17:54"}
  - {testo: "Odia il tetto dei sessanta minuti; sogna la sanzione che solo gli ispettori possono dare. Può solo accumulare fino a chiedere un'ispezione", fonte: "c17:58"}
  - {testo: "Del sistema di sorveglianza vede solo screenshot, non i video", fonte: "c17:58"}
  - {testo: "Si sente «come un cane che ha fiutato un osso sotto il prato del vicino»", fonte: "c17:52"}
non_detto:
  - {testo: "Nei cap. 1-3 Pete non compare mai in scena e non parla."}
stato:
  - {cap: 15, testo: "In scena: passa nel corridoio e rallenta davanti alla stanza di Tom", fonte: "c15:23"}
  - {cap: 17, testo: "Venerdì alle 23:59 riceve la segnalazione della mail fuori orario a Tom. Mette in fila sanzione, mail di dieci giorni prima, porta accostata. Aspetta che Tom la apra; si addormenta col telefono sulla pancia", fonte: "c17:60"}
aperti:
  - {testo: "«Firmato con il nome per esteso» (c17 r. 52), ma la firma riportata è «Pete, Supervisore» (c2 r. 23): Pete è il nome per esteso, o ce n'è un altro."}
  - {testo: "Per Pete Tom consegna ancora «con un margine che nessuno gli chiedeva» (c17 r. 52): non ha notato le due chiusure sull'ultimo secondo (cap. 14 e 15), o non contano."}
relazioni:
