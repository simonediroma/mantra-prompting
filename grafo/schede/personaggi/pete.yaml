  - {verso: ispettori-interni, tipo: "aspira a diventare / invidia", fonte: "c17:58"}
  - {verso: ciao-darwin, tipo: "guarda", fonte: "c17:38"}
  - {verso: postazione-di-pete, tipo: "lavora in", fonte: "c18:41"}
  - {verso: telecamera-di-sorveglianza, tipo: "può usare", fonte: "c18:66-68"}
