note:
  - {testo: "Pete ha firmato la sanzione «con il nome per esteso» (c17 r. 52), ma la firma riportata nel cap. 2 è «Pete, Supervisore» (c2 r. 23). O Pete è già il nome per esteso, o la firma del cap. 2 va allungata."}
