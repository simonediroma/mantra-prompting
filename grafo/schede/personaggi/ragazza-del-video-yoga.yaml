id: ragazza-del-video-yoga
nome: La ragazza dei video eTv
alias: ["la ragazza del video di yoga", "la ragazza con sei dita"]
capitoli: [4, 5, 7, 8, 9, 19]
sintesi: "La protagonista di tutti i video del canale eTv: yoga, idraulica, cucina, musica. Generata, non filmata."
caratteristiche:
  - {testo: "«Una ragazza che sembrava avere vent'anni ed era così brava a spiegare gli esercizi»", fonte: "c4:31"}
  - {testo: "«Quella bella ragazza con cui mi alleno»", fonte: "c5:19"}
  - {testo: "Guarda dritto in camera, sorriso professionale «ripetuto altre mille volte»: «Se vuoi il massimo risultato, guardami a velocità doppia. Fidati, funziona meglio!»", fonte: "c7:23"}
  - {testo: "Bellezza levigata, uniforme, quasi patinata, da copertina ritoccata", fonte: "c7:25"}
  - {testo: "Al minuto tre e qualche secondo, in un affondo laterale, il piede sinistro ha sei dita per due fotogrammi consecutivi: cinque, sei, di nuovo cinque", fonte: "c7:27-29"}
  - {testo: "Conclusione di Tom: un corpo mai filmato, solo generato", fonte: "c7:29"}
  - {testo: "Compare in ogni video del canale, «esperta apparentemente di qualunque cosa»", fonte: "c8:9"}
  - {testo: "Canta con voce impeccabile, «priva di qualunque imperfezione»", fonte: "c8:9"}
  - {testo: "Non ha nome, biografia, profili: a chi gestisce il canale non interessa che qualcuno si ricordi di lei", fonte: "c8:11, c8:13"}
  - {testo: "Nel parlato si presenta così: «Ciao, sono qui per darti la routine che ha cambiato la mia vita»", fonte: "c9:17"}
  - {testo: "Per Emma è «la sua ragazza»", fonte: "c19:55"}
relazioni:
  - {verso: video-yoga, tipo: "compare in", fonte: "c4:31"}

