id: mauro-vargiu
nome: Mauro Vargiu (il trisavolo)
capitoli: [7]
sintesi: "Trisavolo sardo di Tom. Alla dogana il suo cognome fu storpiato in Vardju."
caratteristiche:
  - {testo: "Si presentò al controllo subito dopo un immigrato albanese di cognome Djurdoku: l'impiegato della dogana, distratto, li credette insieme e non chiese come si scrivesse il cognome", fonte: "c7:13"}
  - {testo: "Due lettere: una g diventata d, una i diventata j. Vargiu → Vardju", fonte: "c7:13"}
  - {testo: "La storia è nota «a sentire i racconti di famiglia» (padre e nonna di Tom)", fonte: "c7:11, c7:13"}
non_detto:
  - {testo: "In quale paese sia emigrato non è detto nel cap. 7."}

