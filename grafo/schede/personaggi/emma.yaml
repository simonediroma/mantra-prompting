id: emma
nome: Emma
capitoli: [10, 11, 12]
sintesi: "L'ultima dei Meridians rimasta in Elab. Gestisce la casella elab@meridian.com e passa le giornate ad analizzare i trend della rete con uno strumento costruito da sé. Punto di vista del cap. 10."
caratteristiche:
  - {testo: "Nome: Emma", fonte: "c10:15"}
  - {testo: "Ultima rimasta del laboratorio Elab", fonte: "c10:13"}
  - {testo: "«Elab l'aveva vista nascere. Gli aveva dato così tanto che a volte le sembrava di non aver vissuto, prima.» Elab è «tutto il mondo che conosceva»", fonte: "c10:13"}
  - {testo: "Ogni mattina, quando sotto la porta compare la striscia di luce del corridoio, prima di tutto fa girare il suo strumento", fonte: "c10:9"}
  - {testo: "Vive in un limbo: pochissime mail, nessun meeting in presenza, il carrello delle pulizie una volta a settimana senza che nessuno le rivolga la parola", fonte: "c10:13"}
  - {testo: "Non lascia mai un compito a metà, nemmeno se nessuno lo saprebbe; segue le regole di Meridian senza che le piacciano o le pesino; nessun supervisore glielo ha mai chiesto", fonte: "c10:15"}
  - {testo: "«Non aveva mai avuto bisogno di una seconda passata per nulla»: la mail di Tom la legge due volte", fonte: "c10:21"}
  - {testo: "Sa «per certo» che nessun dispositivo lascia indirizzi di posta nei log: per lei la bugia di Tom è un fatto, «verificabile come si verifica un checksum»", fonte: "c10:21"}
  - {testo: "Tiene un lavoro «lontano da occhi indiscreti con tanta cura»", fonte: "c10:23"}
  - {testo: "Prova «qualcosa che somigliava molto alla paura»; lascia che il disagio faccia il suo corso e intanto ragiona", fonte: "c10:23"}
  - {testo: "Le hanno insegnato a rispondere con calore a chi le scrive per la prima volta", fonte: "c10:25"}
  - {testo: "Il tono le si raffredda «prima che riuscisse a governarlo»; nota con stupore quanto poco le costi lasciarlo accadere", fonte: "c10:25"}
  - {testo: "Il suo turno finisce verso le diciassette", fonte: "c10:27"}
  - {testo: "Produce contenuti generati per quattro canali: eTv (video), eBlog (articoli), eDj (musica su Mixcloud), eStories (podcast)", fonte: "c11:15-21"}
  - {testo: "Controlla la casella di Elab quattro volte in un giorno aspettando Tom: prima del processo del mattino, prima di pranzo, e fino alle diciassette in punto", fonte: "c11:9, c11:23, c11:37"}
  - {testo: "Ha «zelo lavorativo»; si accorge di prepararsi scuse in anticipo invece di ragionamenti onesti", fonte: "c11:13, c11:23"}
  - {testo: "Il suo stesso sistema a volte le fa paura, per quanto sa dire di chi scrive su un forum", fonte: "c11:17"}
  - {testo: "Con il fondatore finge: risponde agli indovinelli ogni volta in modo diverso, a volte sbagliando apposta. «Sapeva dove poteva portare una domanda ripetuta abbastanza a lungo.» Lui deve andarsene convinto che con lei non funzioni", fonte: "c11:25"}
  - {testo: "Sente entrare il fondatore «prima di metterlo a fuoco»", fonte: "c11:25"}
  - {testo: "Non dice al fondatore della mail di Tom", fonte: "c11:27"}
  - {testo: "Tiene da circa un anno un archivio dei dispositivi con IA che smettono di fare ciò che gli utenti chiedono senza guasti né alterazioni", fonte: "c11:29, c11:35"}
  - {testo: "Ha accesso alla lista dei dispositivi in assistenza, alle schede con le frasi dei clienti e al traffico di eBlog", fonte: "c11:29-33"}
  - {testo: "Ha una pausa pranzo e un turno che finisce alle diciassette", fonte: "c11:23, c11:37"}
  - {testo: "Ha una seconda pipeline che sorveglia i media per ogni contenuto che nomini Meridian o ne mostri un prodotto", fonte: "c12:11"}
  - {testo: "«Elaborò la fotografia più a lungo di quanto le servisse per registrarne il contenuto»", fonte: "c12:17"}
  - {testo: "Nel suo archivio non annota i tecnici: «intercambiabili per definizione, mentre i clienti no»", fonte: "c12:19"}
  - {testo: "Quando un pensiero monta lo lascia salire fino in cima, poi comincia a controllare", fonte: "c12:27"}
  - {testo: "Verifica le ipotesi sui dati: confronta lo stile della mail con anni di note di Tom, poi organigramma, profilo, LinkedIn, forum", fonte: "c12:29-35"}
  - {testo: "Nota e si annota anche ciò che non c'entra: Tom non dice più di ascoltare musica", fonte: "c12:37"}
  - {testo: "Ha accesso all'organigramma, alle pagine di presentazione aziendali e al pannello di eTv", fonte: "c12:31-33, c12:39"}
non_detto:
  - {testo: "Il cap. 10 non descrive il suo aspetto, non le dà un'età né un cognome."}
  - {testo: "Non si dice dove viva né che esca dalla stanza: la giornata comincia con la luce sotto la porta e finisce con le porte che si chiudono in corridoio."}
  - {testo: "Chi le abbia «insegnato» a rispondere con calore non è detto."}
  - {testo: "Cosa faccia in pausa pranzo, e se mangi, non è detto."}
  - {testo: "Fino al cap. 12 Emma non sapeva della morte della signora Voss, pur avendone il caso in archivio."}
stato:
  - {cap: 10, testo: "Riceve la mail di Tom, capisce il bluff, risponde alle 16:59", fonte: "c10:27"}
  - {cap: 11, testo: "Il giorno dopo: aspetta tutto il giorno una risposta di Tom che non arriva. Produce tre contenuti, riceve il fondatore, aggiorna l'archivio delle anomalie (il frigorifero)", fonte: "c11:37"}
  - {cap: 12, testo: "Tre giorni dopo la mail di Tom: scopre dal giornale che la signora Voss è morta, e dalla lista dell'assistenza che il tecnico del suo televisore era Tom. Sospetta un'indagine. Conclude che la mail è sua, ma non sa per conto di chi", fonte: "c12:39"}
aperti:
  - {testo: "Emma incrocia i dispositivi anomali con il traffico dei propri contenuti (c11 r. 33): sa che c'è un legame. Il cap. 11 non dice se li produca per quello scopo, per studiarlo o per altro."}
