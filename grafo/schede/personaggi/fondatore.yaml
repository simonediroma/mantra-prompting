id: fondatore
nome: Il fondatore
capitoli: [10, 11]
sintesi: "Fondatore di Meridian e di Elab. L'unico che ogni tanto va a trovare Emma."
caratteristiche:
  - {testo: "Ha contribuito a creare Meridian «quando era poco più che un'idea su una lavagna»", fonte: "c10:13"}
  - {testo: "Con Emma è sempre gentile, la intrattiene con «i suoi soliti indovinelli», sembra sinceramente contento di andarla a trovare quando trova il tempo", fonte: "c10:13"}
  - {testo: "Passa poco dopo mezzogiorno, senza preavviso, «come sempre»; si lascia cadere nella poltrona davanti a Emma", fonte: "c11:25"}
  - {testo: "Due chiacchiere che non salta mai (come va, la riunione durata il doppio), anche quando ha dieci minuti in tutto", fonte: "c11:25"}
  - {testo: "A ogni visita ripete un indovinello «come un mantra», cambiando le parole e mai la domanda; ride piano, senza delusione, quando lei sbaglia", fonte: "c11:25"}
  - {testo: "Ha smesso da anni di ricordare l'indirizzo di Elab", fonte: "c11:27"}
  - {testo: "Prima di uscire stampa sempre un foglio, lo rilegge sorridendo, lo archivia in un raccoglitore; non dice mai cosa sia", fonte: "c11:27"}
non_detto:
  - {testo: "Nome non indicato. Nel cap. 10 non compare in scena."}
  - {testo: "Il testo dell'indovinello non è riportato. Cosa stampi non è detto."}
stato:
  - {cap: 11, testo: "In scena: visita Emma a mezzogiorno", fonte: "c11:25-27"}
relazioni:
  - {verso: meridian, tipo: "fondatore di", fonte: "c10:13"}
  - {verso: elab, tipo: "fondatore di", fonte: "c10:13"}

  - {verso: indovinello-del-fondatore, tipo: "ripete", fonte: "c11:25"}
  - {verso: raccoglitore-del-fondatore, tipo: "archivia in", fonte: "c11:27"}
