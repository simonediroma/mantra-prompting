id: tom
nome: Tom
capitoli: [1, 2, 3, 4, 5, 6, 7, 8, 9]
sintesi: "Tecnico dell'assistenza Meridian, 53 anni, smanettone. Protagonista e punto di vista dei cap. 1-3."
caratteristiche:
  - {testo: "53 anni", fonte: "c1:11"}
  - {testo: "Alto, troppo per gli sgabelli da laboratorio, che disprezza apertamente; magro, di magrezza nervosa; pochi capelli", fonte: "c1:13"}
  - {testo: "Occhiali da lettura calati sulla punta del naso (in laboratorio e la sera a casa)", fonte: "c1:13, c3:13"}
  - {testo: "Felpa con cappuccio anche se in laboratorio si sta benissimo: vestirsi comodi è rispetto per sé e per il lavoro", fonte: "c1:13"}
  - {testo: "Smanettone nel senso nobile: le cose le capisce aprendole, non leggendole", fonte: "c1:15"}
  - {testo: "Dodici anni di assistenza in Meridian", fonte: "c1:23, c2:9"}
  - {testo: "Da bambino parlava alle radio rotte sperando che rispondessero; da lì l'abitudine di interrogare gli apparecchi", fonte: "c1:29"}
  - {testo: "Ha imparato il Morse da bambino con vecchie radio a valvole dei mercatini: la luce gli arriva in testa già tradotta in suono", fonte: "c1:33"}
  - {testo: "Parla poco durante il giorno («io non parlo così spesso durante il giorno»)", fonte: "c1:27"}
  - {testo: "Metodo: mai chiedere la verità direttamente, tendere trappole gentili e vedere cosa ci cade dentro", fonte: "c1:81"}
  - {testo: "Davanti al primo messaggio non prova paura ma euforia per il meccanismo", fonte: "c1:47"}
  - {testo: "Davanti alla sanzione non si arrabbia: freddezza, curiosità clinica", fonte: "c2:27"}
  - {testo: "Trascrive a mano, su carta («come un uomo di un secolo sbagliato»)", fonte: "c1:37"}
  - {testo: "Tiene chiusa la porta del laboratorio per non far entrare i colleghi", fonte: "c1:43"}
  - {testo: "Ha incrociato Pete di persona sì e no tre volte in dodici anni; ne riconosce il passo e cambia strada", fonte: "c2:25"}
  - {testo: "Va al lavoro in autobus; col turno di mattina esce di casa col buio", fonte: "c3:9"}
  - {testo: "Lavora in piedi, appoggiato al banco con due mani", fonte: "c3:21"}
  - {testo: "In dodici anni non aveva mai chiesto a un elettrodomestico come si sentisse", fonte: "c3:21"}
  - {testo: "Si presenta al telefono col suo vero nome: «sono Tom»", fonte: "c4:19"}
  - {testo: "Esce sempre abbastanza presto da arrivare con un quarto d'ora di margine prima del turno", fonte: "c4:11"}
  - {testo: "Non è solito mentire agli esseri umani, solo agli elettrodomestici; recita male e se ne stizzisce", fonte: "c4:9, c4:13"}
  - {testo: "Usa il silenzio come strumento: quasi nessuno lo tollera più di tre secondi", fonte: "c4:29"}
  - {testo: "In dodici anni non aveva mai corso per un autobus; la fermata è a due isolati da casa", fonte: "c4:57"}
  - {testo: "Si è sempre vantato con se stesso di una puntualità totale: mai un ritardo in dodici anni, fino ai due minuti del cap. 5", fonte: "c5:9"}
  - {testo: "Ripara anche altro oltre ai televisori: rimonta un motore di aspirapolvere", fonte: "c5:13"}
  - {testo: "Prima di tutto viene la cena: aspetta a guardare il video perché ha fame", fonte: "c5:15"}
  - {testo: "Da bambino decifrava a pezzi le registrazioni delle radio amatoriali, fermandole e mandandole indietro", fonte: "c5:21"}
  - {testo: "Dà ai propri stati d'animo etichette da scheda d'intervento: «urgenza di verifica»", fonte: "c5:29"}
  - {testo: "Il suo primo pensiero davanti all'avvertimento è tecnico, non umano", fonte: "c5:25"}
  - {testo: "Si occupa lui stesso del ricondizionamento degli apparecchi non ritirati", fonte: "c6:13"}
  - {testo: "Ricorda a memoria i numeri di serie dei televisori annotati nel suo archivio", fonte: "c6:9"}
  - {testo: "Come tecnico ha accesso in lettura all'intero registro interventi", fonte: "c6:19"}
  - {testo: "Non gli interessa la morte in sé né fare giustizia: vuole sapere cosa è successo, il meccanismo", fonte: "c6:27"}
  - {testo: "Davanti alla notizia della morte posa il cacciavite «con più cura del necessario»: non ha un'etichetta pronta per quello che prova", fonte: "c6:23"}
  - {testo: "Non ha mai incontrato di persona la signora Voss", fonte: "c6:27"}
  - {testo: "Cognome: Vardju. Suona slavo; in Meridian gli dà «un'aria da smanettone». Nessuno in azienda potrebbe risalire all'origine sarda", fonte: "c7:13"}
  - {testo: "Origini sarde: i trisavoli lasciarono la Sardegna più di un secolo prima; gliene parlavano il padre e la nonna", fonte: "c7:11"}
  - {testo: "Non parla italiano, non l'ha mai imparato davvero, ma ci entra in sintonia", fonte: "c7:11"}
  - {testo: "Musica per concentrarsi davanti a uno schermo: Tango dei Matia Bazar, che non metteva da anni", fonte: "c7:11"}
  - {testo: "Da quando il progetto del giradischi ha toccato l'apice ne parla ancora con gli audiofili, ma ha smesso di ascoltare musica", fonte: "c7:9"}
  - {testo: "Pulisce gli occhiali da lettura sul bordo della felpa", fonte: "c7:15"}
  - {testo: "Affronta una ricerca come un guasto multiplo: elimina prima le variabili più ovvie, non le più interessanti", fonte: "c7:15"}
  - {testo: "Usa un assistente IA: non gli chiede di indovinare, gli chiede di ordinare per un profilo", fonte: "c7:17"}
  - {testo: "Guarda prima quello che manca, non quello che c'è", fonte: "c8:11"}
  - {testo: "Conosce il canale YouTube del New York Times; di canali e rapporti views/iscritti sa poco", fonte: "c8:13"}
  - {testo: "I quindici minuti di anticipo sono intoccabili: quando gli serve tempo lo prende dal sonno, alzandosi un'ora prima", fonte: "c9:9"}
  - {testo: "Chiude la porta del laboratorio a doppia mandata, «clac clac», come sempre", fonte: "c9:25"}
  - {testo: "Fuori carica file su siti sconosciuti senza pensarci; dentro Meridian non lascia tracce: «ogni clic aveva un proprietario»", fonte: "c9:27"}
  - {testo: "Circa dieci anni prima era «agli inizi della propria carriera in Meridian»", fonte: "c9:39"}
stato:
  - {cap: 1, testo: "Scopre che un televisore risponde in Morse; perde tempo oltre il limite; prende tempo etichettando l'unità come anomalia", fonte: "c1:97"}
  - {cap: 2, testo: "Richiamo formale e trattenuta di 47 minuti; perde il televisore; decide di tenere lui il cronometro e un archivio privato", fonte: "c2:45"}
  - {cap: 3, testo: "Da tre mesi è il tecnico più efficiente del reparto (margine medio 47 secondi); turno di mattina da qualche settimana; al secondo contatto conclude «ce n'è più di uno»", fonte: "c3:9, c3:37"}
  - {cap: 4, testo: "Chiama la signora Voss dal proprio cellulare fingendosi il controllo qualità; scopre che esiste un video; brucia tutti i quindici minuti di anticipo e corre all'autobus", fonte: "c4:57"}
  - {cap: 5, testo: "Primo ritardo in dodici anni (2 minuti). La sera decifra il video: il televisore avvertiva la signora. Annota «consapevole. Benevolo, non ostile.» Il mattino dopo la signora non risponde", fonte: "c5:33, c5:37"}
  - {cap: 6, testo: "Tre settimane dopo: gli torna sul banco il televisore Voss per il ricondizionamento. Scopre dal registro che la signora è morta, e dal post del fratello che è morta di cuore facendo yoga. Decide di cercare il video di yoga", fonte: "c6:21, c6:31, c6:35"}
  - {cap: 7, testo: "La stessa sera del cap. 6: trova un video «Yoga fit» compatibile con la signora Voss e, a un quarto di velocità, scopre che la ragazza ha sei dita per due fotogrammi. Il video è generato. Clicca sul canale: eTv", fonte: "c7:27-33"}
  - {cap: 8, testo: "Stessa sera, fin dopo le undici: analizza il canale eTv e conclude che è un'operazione. Rimanda a domani: capire con quale IA sia stato generato il video, per risalire dai clienti dello strumento a chi sta dietro", fonte: "c8:17-19"}
  - {cap: 9, testo: "Il giorno dopo: i rilevatori pubblici danno il video per reale ma il parlato per generato. A fine turno cerca il testo nell'archivio interno: è un prodotto Meridian, modello internal_unknown, contatto elab@meridian.com", fonte: "c9:31-37"}
aperti:
  - {testo: "Tom «non parlava italiano» (c7 r. 11) ma i messaggi Morse che trascrive sono in italiano (IO SONO QUI) e ragiona sulla parola «bella»: il libro è scritto in italiano per convenzione, ma qui l'italiano è nominato come lingua straniera per Tom. Da decidere in che lingua avvengono, nella storia, dialoghi e messaggi."}
